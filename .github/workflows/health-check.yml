name: EduCollege Lead Sheets Health Check

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check All Google Sheets
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install --quiet google-auth google-api-python-client requests 2>/dev/null

          python3 << 'EOF'
          import os
          import json
          import requests
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from datetime import datetime, timezone

          # ── Load service account ──────────────────────────────
          print("Step 1: Loading service account...")
          sa_info = json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])
          creds = service_account.Credentials.from_service_account_info(
              sa_info,
              scopes=["https://www.googleapis.com/auth/spreadsheets.readonly"]
          )
          service = build("sheets", "v4", credentials=creds)
          print("Step 1: Done ✅")

          # ── All your sheets ───────────────────────────────────
          PROJECTS = {
              "WILP":         "1qetzRCxPBgnjUUMMBCOY5wWflmD8iyt-LNTcU1WM9QA",
              "MBA":          "1W1T3dXWxnqwL2v_pbjgwKCFF5mi2qnwHPj8FF1PR1tI",
              "ISB":          "1lFmcROAflbqvnqGbx5V_orLsMLKUcjI6FpIeDabDR6k",
              "University":   "1AdtqyEh9BYlLNpEooLoRIS8YH6Ekomec9oPspSaavVI",
              "Bennett":      "1xq1994WQoKTd6mQ8G2z3rjke5WEMQViGR2P-g6_9NSM",
              "OnlineDegree": "1IsEYnDzZOOnOVpczY2RGeadYJfhWH2FdWnC3Cgsecj0",
              "ROI":          "1JzRjbixrpOlkUIVJUIHVuOp1SZaJ_zAT18cxXKLaz0c",
              "Leads":        "1qMpNOlLQNDuk_jR_yq61UF3kOlRpUfR0vdfaAroWUmQ",
          }

          # ── Check each sheet ──────────────────────────────────
          print("Step 2: Checking sheets...")
          results = []
          all_healthy = True

          for name, sheet_id in PROJECTS.items():
              try:
                  sheet = service.spreadsheets().get(spreadsheetId=sheet_id).execute()
                  title = sheet.get("properties", {}).get("title", "Unknown")
                  results.append(f"✅ {name} — {title}")
                  print(f"  ✅ {name}")
              except Exception as e:
                  results.append(f"❌ {name} — {str(e)[:80]}")
                  print(f"  ❌ {name} — {str(e)[:80]}")
                  all_healthy = False

          print("Step 2: Done ✅")

          # ── Build Discord message ─────────────────────────────
          timestamp = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")
          description = "\n".join(results) + f"\n\n🕐 {timestamp}"
          title = "✅ All Lead Sheets Healthy" if all_healthy else "🚨 Some Sheets Have Issues"
          color = 65280 if all_healthy else 16711680

          payload = {
              "embeds": [{
                  "title": title,
                  "description": description,
                  "color": color
              }]
          }

          # ── Send to Discord via requests ──────────────────────
          print("Step 3: Sending to Discord...")
          webhook_url = os.environ["DISCORD_WEBHOOK"].strip()

          resp = requests.post(webhook_url, json=payload)
          print(f"  Discord status: {resp.status_code}")

          if resp.status_code in (200, 204):
              print("  Discord: ✅ Message sent!")
          else:
              print(f"  Discord error body: {resp.text}")
              raise Exception(f"Discord failed with status {resp.status_code}: {resp.text}")

          print("Step 3: Done ✅")
          print("\nFull message sent:")
          print(description)
          EOF