name: EduCollege Lead Sheets Health Check

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check All Google Sheets
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |

          ALL_HEALTHY=true
          RESULTS=""

          check_sheet() {
            local NAME=$1
            local SHEET_ID=$2
            local URL="https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}?key=${GOOGLE_API_KEY}"
            local RESP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$URL")

            if [ "$RESP" = "200" ]; then
              RESULTS="${RESULTS}✅ ${NAME}\n"
            else
              RESULTS="${RESULTS}❌ ${NAME} — HTTP ${RESP}\n"
              ALL_HEALTHY=false
            fi
          }

          check_sheet "WILP"         "1qetzRCxPBgnjUUMMBCOY5wWflmD8iyt-LNTcU1WM9QA"
          check_sheet "MBA"          "1W1T3dXWxnqwL2v_pbjgwKCFF5mi2qnwHPj8FF1PR1tl"
          check_sheet "ISB"          "1lFmcROAflbqvnqGbx5V_orLsMLKUcjI6FpIeDabDR6k"
          check_sheet "University"   "1AdtqyEh9BYILNpEooLoRIS8YH6Ekomec9oPspSaavVI"
          check_sheet "Bennett"      "1xq1994WQoKTd6mQ8G2z3rjke5WEMQViGR2P-g6_9NSM"
          check_sheet "OnlineDegree" "1lsEYnDzzZOOnOVpczY2RGeadYJfhWH2FdWnC3Cgsecj0"
          check_sheet "ROI"          "1JzRjbixrpOlkUIVJUIHVuOp1SZaJ_zAT18cxXKLaz0c"
          check_sheet "Leads"        "1qMpNOILQNDuk_jR_yq61UF3kOIRpUfR0vdfaAroWUmQ"

          # Build description safely
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          DESCRIPTION=$(printf "%b\n🕐 %s" "$RESULTS" "$TIMESTAMP")

          if [ "$ALL_HEALTHY" = "true" ]; then
            TITLE="✅ All Lead Sheets Healthy"
            COLOR=65280
          else
            TITLE="🚨 Some Sheets Have Issues"
            COLOR=16711680
          fi

          # Build and send JSON safely via jq
          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg desc "$DESCRIPTION" \
            --argjson color "$COLOR" \
            '{embeds: [{title: $title, description: $desc, color: $color}]}')

          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"